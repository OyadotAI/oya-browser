apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: oya-browser
type: Opaque
stringData:
  API_KEYS: "key1,key2"
  # Encrypts project keys and credentials at rest. Generate once (openssl rand -hex 32), back it up, never change it:
  # a pod restart without it regenerates the key and makes every stored project unreadable.
  OYA_PROFILE_SECRET: "64-hex-chars"
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_SERVICE_KEY: "your-service-role-key"
