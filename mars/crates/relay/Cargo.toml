# Relay owns bounded networking independently of the Mars application.
[package]
name = "mars-relay"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mars-core = { path = "../core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12", "brotli"] }
webpki-roots = "=1.0.11"
# Rustls's own crypto backend, used directly for the TLS 1.2 RSA key exchange Rustls lacks.
ring = "=0.17.14"
httpdate = "=1.0.3"
# Pure-Rust content codings: gzip/deflate via miniz_oxide, Brotli via its reference decoder.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
brotli-decompressor = "=6.0.1"
# Zstandard content coding, decoder only, pure Rust.
ruzstd = { version = "=0.9.1", default-features = false, features = ["std"] }
# Mozilla's Public Suffix List compiled into a match, so Domain cookies and SameSite use registrable domains.
psl = "=2.1.245"

[dev-dependencies]
# Encoders exist only to build compressed loopback fixtures.
brotli = "=9.0.0"
httpdate = "=1.0.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
