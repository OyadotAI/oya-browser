apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oya-browser-dev-cert
  namespace: oya-browser-dev
spec:
  secretName: oya-browser-dev-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - dev.oyabrowser.com
  # Legacy hosts, still served (redirect to the canonical domain)
  - dev-browser.getoya.ai
  - dev-browser.oya.ai
