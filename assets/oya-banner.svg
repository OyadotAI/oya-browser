<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0a"/>
      <stop offset="60%" stop-color="#141410"/>
      <stop offset="100%" stop-color="#0c0c0a"/>
    </linearGradient>
    <radialGradient id="glow-green" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#39ed35" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#39ed35" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0c0c0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Ambient Glow -->
  <circle cx="600" cy="180" r="320" fill="url(#glow-green)" filter="url(#blur-glow)"/>

  <!-- Background Grid Pattern -->
  <g opacity="0.12">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" stroke="#39ed35" stroke-dasharray="3 6" stroke-width="0.8"/>
    <path d="M120 0 V420 M240 0 V420 M360 0 V420 M480 0 V420 M600 0 V420 M720 0 V420 M840 0 V420 M960 0 V420 M1080 0 V420" stroke="#39ed35" stroke-dasharray="3 6" stroke-width="0.8"/>
  </g>

  <!-- Top Pill / Release Tag -->
  <g transform="translate(600, 56)">
    <rect x="-160" y="-15" width="320" height="30" rx="15" fill="#1c1c18" stroke="rgba(57,237,53,0.3)" stroke-width="1"/>
    <circle cx="-136" cy="0" r="4" fill="#39ed35"/>
    <text x="-122" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#39ed35" letter-spacing="1.5">RECORD ONCE · REPLAY FOREVER</text>
  </g>

  <!-- Oya mark: exact geometry of ui/src/components/oya-logo.tsx (512 grid), 96px -->
  <g transform="translate(552, 92) scale(0.1875)" fill="none" stroke-width="80">
    <circle cx="276" cy="276" r="160" stroke="#39ed35"/>
    <circle cx="236" cy="236" r="160" stroke="#f0f0e8"/>
  </g>

  <!-- Main Headline -->
  <text x="600" y="248" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    Oya Browser
  </text>

  <!-- Subtitle -->
  <text x="600" y="288" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.72)" letter-spacing="-0.2">
    Everyone else drives Chrome from outside. We built the browser.
  </text>

  <!-- Capability Badges -->
  <g transform="translate(600, 345)">
    <!-- Badge 1: Multi-Provider -->
    <g transform="translate(-400, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="8" fill="#1c1c18" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="12" font-weight="500" fill="#e2e0d8">⏺ Replay with no model</text>
    </g>

    <!-- Badge 2: Deterministic Personas -->
    <g transform="translate(-135, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="8" fill="#1c1c18" stroke="rgba(57,237,53,0.25)" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="12" font-weight="600" fill="#39ed35">◉ Inside the browser</text>
    </g>

    <!-- Badge 3: Desktop SSO Pairing -->
    <g transform="translate(135, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="8" fill="#1c1c18" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="12" font-weight="500" fill="#e2e0d8">🔑 Sign in once, reuse it</text>
    </g>

    <!-- Badge 4: Sub-second Live View -->
    <g transform="translate(400, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="8" fill="#1c1c18" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="12" font-weight="500" fill="#e2e0d8">⚡ Hand it to a person</text>
    </g>
  </g>
</svg>
