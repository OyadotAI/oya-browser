name: Redeploy Prod (no new release)

# Rolling the cloud-browser snapshot back needed either a new tag or a laptop
# with cluster credentials, and neither is what you want when prod is already
# broken. This re-applies the secrets and restarts the server on demand.
#
# The snapshot input wins over the DAYTONA_SNAPSHOT secret, so a bad snapshot
# can be reverted from the Actions tab without touching the repo.

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'DAYTONA_SNAPSHOT to deploy (blank = use the repo secret)'
        required: false
        type: string

env:
  NAMESPACE: oya-browser

# Least privilege by default; jobs that need more say so themselves.
permissions:
  contents: read

jobs:
  redeploy:
    name: Re-apply secrets and restart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GKE_SA_KEY }}

    - uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ secrets.GKE_CLUSTER }}
        location: ${{ secrets.GKE_ZONE }}
        project_id: ${{ secrets.GKE_PROJECT }}

    - name: Apply secrets
      env:
        SNAPSHOT_INPUT: ${{ inputs.snapshot }}
        DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        DAYTONA_SNAPSHOT: ${{ secrets.DAYTONA_SNAPSHOT }}
        DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
        DAYTONA_TARGET: ${{ secrets.DAYTONA_TARGET }}
        API_KEYS: ${{ secrets.API_KEYS }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        OYA_PROFILE_SECRET: ${{ secrets.OYA_PROFILE_SECRET }}
      run: |
        SNAPSHOT="${SNAPSHOT_INPUT:-$DAYTONA_SNAPSHOT}"
        : "${DAYTONA_API_KEY:?Missing DAYTONA_API_KEY deployment secret}"
        # Without it the server generates a new key per restart and every stored project becomes unreadable.
        : "${OYA_PROFILE_SECRET:?Missing OYA_PROFILE_SECRET deployment secret}"
        : "${SNAPSHOT:?No snapshot given and DAYTONA_SNAPSHOT secret is empty}"
        echo "Deploying with DAYTONA_SNAPSHOT=${SNAPSHOT}"
        kubectl create secret generic app-secrets \
          --from-literal=API_KEYS="${API_KEYS}" \
          --from-literal=SUPABASE_URL="${SUPABASE_URL}" \
          --from-literal=SUPABASE_SERVICE_KEY="${SUPABASE_SERVICE_KEY}" \
          --from-literal=OYA_PROFILE_SECRET="${OYA_PROFILE_SECRET}" \
          --from-literal=DAYTONA_API_KEY="${DAYTONA_API_KEY}" \
          --from-literal=DAYTONA_SNAPSHOT="${SNAPSHOT}" \
          --from-literal=DAYTONA_API_URL="${DAYTONA_API_URL}" \
          --from-literal=DAYTONA_TARGET="${DAYTONA_TARGET}" \
          -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Restart the server so it picks the secret up
      run: |
        kubectl rollout restart deployment/server -n ${{ env.NAMESPACE }}
        kubectl rollout status deployment/server -n ${{ env.NAMESPACE }} --timeout=180s

    - name: Confirm what the server is now provisioning from
      run: |
        kubectl get secret app-secrets -n ${{ env.NAMESPACE }} \
          -o jsonpath='{.data.DAYTONA_SNAPSHOT}' | base64 -d; echo
