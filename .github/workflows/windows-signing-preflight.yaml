# Check inherited release signing configuration without publishing assets or exposing credentials.
name: Windows signing preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-signing-preflight
  cancel-in-progress: true
jobs:
  signing-configuration:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check signing configuration availability
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNER_SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: |
          $missing = @()
          foreach ($name in @('WIN_CSC_LINK', 'WIN_CSC_KEY_PASSWORD', 'WINDOWS_SIGNER_SUBJECT')) {
            $configured = -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))
            Write-Output "$name configured=$configured"
            if (-not $configured) { $missing += $name }
          }
          if ($missing.Count -gt 0) { throw "Missing Windows signing configuration: $($missing -join ', ')" }
