name: Deploy Dev (dev.oyabrowser.com)

on:
  push:
    branches: [main]

# Least privilege by default; jobs that need more say so themselves.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_SERVER: ghcr.io/oyadotai/oya-browser-server
  IMAGE_BROWSER: ghcr.io/oyadotai/oya-browser
  TAG: dev
  NAMESPACE: oya-browser-dev

jobs:
  # The gate. Nothing is built or deployed unless the suite is green.
  # A release commit only moves version numbers, and its tag runs this same suite
  # and deploys prod from the same commit: running it here too tested one commit twice.
  ci:
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    uses: ./.github/workflows/ci.yaml
    # CI's coverage jobs log in to Codecov by OIDC, which needs id-token granted from here.
    permissions:
      contents: read
      id-token: write

  changes:
    name: Detect changes
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.filter.outputs.server }}
      browser: ${{ steps.filter.outputs.browser }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          server:
            - 'server/**'
            - 'ui/**'
            # Everything the root Dockerfile copies from browser/ into the server image.
            - 'browser/scripts/**'
            - 'browser/anonymity/**'
            - 'browser/src/package.json'
            - 'browser/src/workflow/**'
            - 'browser/src/page/**'
            - 'browser/src/anonymity/**'
            - 'browser/package.json'
            - 'Dockerfile'
          browser:
            - 'browser/**'
          k8s:
            - 'k8s/**'

  build:
    name: Build & push image
    needs: [ci, changes]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    - uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download browser binaries from latest release
      run: |
        mkdir -p server/downloads
        LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
        echo "Downloading binaries from release $LATEST_TAG"
        gh release download "$LATEST_TAG" --pattern '*.dmg' --dir server/downloads --clobber || true
        gh release download "$LATEST_TAG" --pattern '*.AppImage' --dir server/downloads --clobber || true
        ls -lh server/downloads/ || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/setup-buildx-action@v4
    - uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE_SERVER }}:${{ env.TAG }}
        platforms: linux/amd64
        cache-from: type=gha,scope=server-dev
        cache-to: type=gha,mode=max,scope=server-dev

  build-browser:
    name: Build & push browser image
    needs: [ci, changes]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    - uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/setup-buildx-action@v4
    - uses: docker/build-push-action@v7
      with:
        context: browser
        push: true
        tags: ${{ env.IMAGE_BROWSER }}:${{ env.TAG }}
        platforms: linux/amd64
        cache-from: type=gha,scope=browser-dev
        cache-to: type=gha,mode=max,scope=browser-dev

  deploy:
    name: Deploy to GKE (dev)
    # Named so the repo's Deployments panel lists dev beside production, with a link.
    environment:
      name: dev
      url: https://dev.oyabrowser.com
    # ci is named here as well as in the build jobs: a failed gate only *skips*
    # those, and `!failure()` does not count a skipped dependency, so without it
    # a red suite would still deploy.
    needs: [ci, changes, build, build-browser]
    if: always() && !failure() && !cancelled() && !startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7

    # Keyless by Workload Identity Federation once GCP_WIF_PROVIDER is set
    # (deployments/gcloud/OIDC.md); the JSON key is only the fallback until then.
    - uses: google-github-actions/auth@v3
      if: ${{ vars.GCP_WIF_PROVIDER != '' }}
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: ${{ vars.GCP_DEPLOY_SA }}

    - uses: google-github-actions/auth@v3
      if: ${{ vars.GCP_WIF_PROVIDER == '' }}
      with:
        credentials_json: ${{ secrets.GKE_SA_KEY }}

    - uses: google-github-actions/get-gke-credentials@v3
      with:
        cluster_name: ${{ secrets.GKE_CLUSTER }}
        location: ${{ secrets.GKE_ZONE }}
        project_id: ${{ secrets.GKE_PROJECT }}

    - name: Create namespace
      run: kubectl create namespace ${{ env.NAMESPACE }} 2>/dev/null || true

    - name: Apply secrets
      env:
        # Through env, not ${{ }} in the script: expression interpolation pastes
        # the value into the command line before the shell parses it, so a
        # secret containing a quote or $(...) escapes and executes on the runner.
        API_KEYS: ${{ secrets.API_KEYS }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Every table lives in Postgres (the Supabase project's own); Supabase itself is sign-in only.
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Turnstile captcha on sign-in and sign-up. Optional: off when unset.
        TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        OYA_PROFILE_SECRET: ${{ secrets.OYA_PROFILE_SECRET }}
        # Signs the audit trail; one key per environment, kept in the Keychain too. Empty falls back to a key derived from OYA_PROFILE_SECRET.
        OYA_AUDIT_HMAC_KEY: ${{ secrets.OYA_AUDIT_HMAC_KEY }}
        DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        # Last resort only: dev runs the snapshot prod runs, read from the prod namespace below.
        DAYTONA_SNAPSHOT_FALLBACK: ${{ secrets.DAYTONA_SNAPSHOT }}
        DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
        DAYTONA_TARGET: ${{ secrets.DAYTONA_TARGET }}
        # Slack alerts. Optional: with no app configured the console still offers
        # the bring-your-own-bot-token path, so a missing value must not fail the deploy.
        SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
        SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
        SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
        # Product analytics and ops messages. Optional: each is a no-op when unset.
        POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        # The hosted-deployment license: without it dev is capped at 5 cloud browsers and pings like a self-hosted server.
        OYA_LICENSE_KEY: ${{ secrets.OYA_LICENSE_KEY }}
        SLACK_OPS_WEBHOOK_SIGNUPS: ${{ secrets.SLACK_OPS_WEBHOOK_SIGNUPS }}
        SLACK_OPS_WEBHOOK_EVENTS: ${{ secrets.SLACK_OPS_WEBHOOK_EVENTS }}
        SLACK_OPS_WEBHOOK_PRODUCT: ${{ secrets.SLACK_OPS_WEBHOOK_PRODUCT }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        # Residential exit for cloud personas without their own proxy. Optional.
        OYA_RESIDENTIAL_PROXY_URL: ${{ secrets.OYA_RESIDENTIAL_PROXY_URL }}
      run: |
        : "${DAYTONA_API_KEY:?Missing DAYTONA_API_KEY deployment secret}"
        # Without it the server generates a new key per restart and every stored project becomes unreadable.
        : "${OYA_PROFILE_SECRET:?Missing OYA_PROFILE_SECRET deployment secret}"
        # Without it the server refuses to start: Supabase sign-in needs OYA_STORAGE=postgres and DATABASE_URL.
        : "${DATABASE_URL:?Missing DATABASE_URL deployment secret (the Supabase project Postgres connection string)}"
        # The latest release's snapshot is the one prod deployed; the prod workflow keeps it
        # current, so nothing has to copy it into a repository secret after each release.
        DAYTONA_SNAPSHOT=$(kubectl get secret app-secrets -n oya-browser \
          -o jsonpath='{.data.DAYTONA_SNAPSHOT}' 2>/dev/null | base64 -d || true)
        DAYTONA_SNAPSHOT="${DAYTONA_SNAPSHOT:-$DAYTONA_SNAPSHOT_FALLBACK}"
        : "${DAYTONA_SNAPSHOT:?No snapshot deployed in prod and no DAYTONA_SNAPSHOT secret}"
        kubectl create secret generic app-secrets \
          --from-literal=API_KEYS="${API_KEYS}" \
          --from-literal=SUPABASE_URL="${SUPABASE_URL}" \
          --from-literal=SUPABASE_SERVICE_KEY="${SUPABASE_SERVICE_KEY}" \
          --from-literal=OYA_STORAGE=postgres \
          --from-literal=DATABASE_URL="${DATABASE_URL}" \
          --from-literal=TURNSTILE_SITE_KEY="${TURNSTILE_SITE_KEY}" \
          --from-literal=TURNSTILE_SECRET_KEY="${TURNSTILE_SECRET_KEY}" \
          --from-literal=OYA_PROFILE_SECRET="${OYA_PROFILE_SECRET}" \
          --from-literal=OYA_AUDIT_HMAC_KEY="${OYA_AUDIT_HMAC_KEY}" \
          --from-literal=DAYTONA_API_KEY="${DAYTONA_API_KEY}" \
          --from-literal=DAYTONA_SNAPSHOT="${DAYTONA_SNAPSHOT}" \
          --from-literal=DAYTONA_API_URL="${DAYTONA_API_URL}" \
          --from-literal=DAYTONA_TARGET="${DAYTONA_TARGET}" \
          --from-literal=SLACK_CLIENT_ID="${SLACK_CLIENT_ID}" \
          --from-literal=SLACK_CLIENT_SECRET="${SLACK_CLIENT_SECRET}" \
          --from-literal=SLACK_SIGNING_SECRET="${SLACK_SIGNING_SECRET}" \
          --from-literal=POSTHOG_KEY="${POSTHOG_KEY}" \
          --from-literal=POSTHOG_HOST="${POSTHOG_HOST}" \
          --from-literal=OYA_LICENSE_KEY="${OYA_LICENSE_KEY}" \
          --from-literal=SLACK_OPS_WEBHOOK_SIGNUPS="${SLACK_OPS_WEBHOOK_SIGNUPS}" \
          --from-literal=SLACK_OPS_WEBHOOK_EVENTS="${SLACK_OPS_WEBHOOK_EVENTS}" \
          --from-literal=SLACK_OPS_WEBHOOK_PRODUCT="${SLACK_OPS_WEBHOOK_PRODUCT}" \
          --from-literal=SENTRY_DSN="${SENTRY_DSN}" \
          --from-literal=SENTRY_ENVIRONMENT=development \
          --from-literal=OYA_RESIDENTIAL_PROXY_URL="${OYA_RESIDENTIAL_PROXY_URL}" \
          -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Create GHCR pull secret
      env:
        GHCR_PAT: ${{ secrets.GHCR_PAT }}
      run: |
        kubectl delete secret ghcr-oyadotai -n ${{ env.NAMESPACE }} 2>/dev/null || true
        kubectl create secret docker-registry ghcr-oyadotai \
          --docker-server=ghcr.io \
          --docker-username='${{ github.repository_owner }}' \
          --docker-password="${GHCR_PAT}" \
          -n ${{ env.NAMESPACE }}

    # The hosted image starts the server directly, so create billing adjustment
    # tables before any new pod can read them. This additive migration is safe to retry.
    - name: Apply admin billing migration
      env:
        PGDATABASE: ${{ secrets.OYA_MIGRATE_DATABASE_URL || secrets.DATABASE_URL }}
        PGCONNECT_TIMEOUT: '10'
      run: |
        : "${PGDATABASE:?Missing database connection for billing migration}"
        psql -X --dbname="$PGDATABASE" --set=ON_ERROR_STOP=1 --single-transaction --file=server/migrations/022_admin_billing.sql --file=server/migrations/023_agent_step_grants.sql

    - name: Deploy with Kustomize
      run: kubectl apply -k k8s/overlays/dev

    - name: Rolling restart server
      if: needs.changes.outputs.server == 'true' || needs.changes.outputs.k8s == 'true'
      run: |
        kubectl patch deployment server -n ${{ env.NAMESPACE }} \
          -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"rollout\":\"$(date +%s)\"}}}}}" || true

    - name: Rolling restart browser
      if: needs.changes.outputs.browser == 'true' || needs.changes.outputs.k8s == 'true'
      run: |
        kubectl patch deployment browser -n ${{ env.NAMESPACE }} \
          -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"rollout\":\"$(date +%s)\"}}}}}" || true

    - name: Wait for rollout
      # No `|| true`, a stuck rollout (ImagePullBackOff, unschedulable) must
      # fail the job instead of reporting a green deploy that never landed.
      run: |
        kubectl rollout status deployment/server -n ${{ env.NAMESPACE }} --timeout=180s
        kubectl rollout status deployment/browser -n ${{ env.NAMESPACE }} --timeout=180s

    - name: Diagnose failed rollout
      if: failure()
      run: |
        kubectl get pods -n ${{ env.NAMESPACE }}
        kubectl get events -n ${{ env.NAMESPACE }} --field-selector type=Warning \
          --sort-by=.lastTimestamp | tail -20

    - name: Show status
      if: always()
      run: kubectl get pods,svc,ingress -n ${{ env.NAMESPACE }}

  # Tells Slack how the dev deploy went: deployed, skipped (nothing changed),
  # which stage failed, or cancelled, with the commit and the files it changed.
  # Copied from A2ABase's pipeline. Release commits deploy prod, not dev, so
  # they post nothing here.
  notify:
    name: Slack notify (dev)
    needs: [ci, changes, build, build-browser, deploy]
    if: ${{ always() && !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-24.04
    steps:
      # History, to diff what this push changed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute diff
        id: diff
        run: |
          # The mrkdwn block is composed here so its newlines are real.
          BEFORE='${{ github.event.before }}'
          AFTER='${{ github.event.after }}'
          # A first push has no "before": diff against the parent.
          if [[ "$BEFORE" =~ ^0+$ ]]; then BEFORE="${AFTER}^"; fi
          git rev-parse "$BEFORE" >/dev/null 2>&1 || BEFORE="HEAD~1"
          git rev-parse "$AFTER" >/dev/null 2>&1 || AFTER="HEAD"
          STAT=$(git diff --stat "$BEFORE..$AFTER" 2>/dev/null || echo "(stat unavailable)")
          # Headroom under Slack's 3000-character block limit.
          STAT="${STAT:0:2500}"
          {
            echo "files_block<<DIFF_BLOCK_EOF"
            printf '*Files changed:*\n```\n%s\n```\n' "$STAT"
            echo "DIFF_BLOCK_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute outcome
        id: outcome
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "emoji=✅" >> "$GITHUB_OUTPUT"; echo "status=Deploy succeeded" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.ci.result }}" == "failure" ]]; then
            echo "emoji=❌" >> "$GITHUB_OUTPUT"; echo "status=Tests failed" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.build.result }}" == "failure" || "${{ needs.build-browser.result }}" == "failure" ]]; then
            echo "emoji=❌" >> "$GITHUB_OUTPUT"; echo "status=Image build failed" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            echo "emoji=❌" >> "$GITHUB_OUTPUT"; echo "status=Deploy failed" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.deploy.result }}" == "skipped" ]]; then
            echo "emoji=⏭️" >> "$GITHUB_OUTPUT"; echo "status=Nothing to deploy" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=⚪" >> "$GITHUB_OUTPUT"; echo "status=Cancelled" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to Slack
        # A notice, not a gate: a revoked webhook must not mark a good deploy failed.
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL || secrets.SLACK_OPS_WEBHOOK_EVENTS }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.outcome.outputs.emoji }} dev.oyabrowser.com: ${{ steps.outcome.outputs.status }} (${{ github.actor }})",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.outcome.outputs.emoji }} *dev.oyabrowser.com*: ${{ steps.outcome.outputs.status }}\n*${{ github.actor }}* pushed to `main`"
                  }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": ${{ toJSON(format('>{0}', github.event.head_commit.message)) }} }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": ${{ toJSON(steps.diff.outputs.files_block) }} }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "<${{ github.event.compare }}|View full diff on GitHub> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run>"
                    }
                  ]
                }
              ]
            }
