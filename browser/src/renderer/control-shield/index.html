<!doctype html>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
<style>
  /* Oya's own tokens (ui/src/app/globals.css), and one light the whole show is lit by: green into mint, white and a cold cyan. */
  :root {
    --oya: #39ed35;
    --mint: #a6ffc9;
    --cyan: #5ef3ff;
    --paper: #f4f3ef;
    --ink: #0c0c0a;
    --light: #39ed35, #a6ffc9, #ffffff, #5ef3ff, #39ed35;
    /* A soft spring, sampled: it settles without a bounce you can see. */
    --spring: linear(
      0,
      0.009,
      0.035 2.1%,
      0.141 4.4%,
      0.723 12.9%,
      0.938 16.7%,
      1.017 20.4%,
      1.043 24.5%,
      1.035 29.4%,
      1.007 38.6%,
      0.997 48.3%,
      1
    );
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    /* Slow in, slow out: for anything that travels, so it never starts or stops with a jolt. */
    --glide: cubic-bezier(0.65, 0, 0.35, 1);
    --mono: 'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, monospace;
  }
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    cursor: default;
    user-select: none;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Watch-only, said quietly: a hairline, nothing more. */
  body {
    box-shadow: inset 0 0 0 1px #39ed3521;
    box-sizing: border-box;
  }

  /*
   * ── The veil: the page dims under smoked glass while the agent reads it ──
   * Then each element it found opens a soft window in it, so what the agent can use is
   * the only thing left in full light. One canvas draws every opening (veil.ts),
   * so a hundred of them cost one layer. It reaches past the window so its blur never
   * lightens the edges.
   */
  #veil {
    position: fixed;
    inset: -12px;
    width: calc(100% + 24px);
    height: calc(100% + 24px);
    pointer-events: none;
    opacity: 0;
    filter: blur(3px);
    transition: opacity var(--fade, 1200ms) var(--ease);
  }
  .scanning #veil {
    opacity: 0.55;
  }
  .lit #veil {
    opacity: 1;
  }

  /* ── The edge light: an aurora that drifts around the page while the agent works ── */
  .edge {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1600ms var(--ease);
  }
  /* Each layer masks its light to a frame, and its wrapper blurs it: a filter runs before a mask, so the blur must sit outside. */
  .edge b {
    position: absolute;
    inset: 0;
  }
  .edge i {
    position: absolute;
    inset: 0;
    overflow: hidden;
    mask:
      linear-gradient(#000 0 0) content-box exclude,
      linear-gradient(#000 0 0);
  }
  /* The light itself: a square of colour wide enough to cover the page at any angle, turned on the compositor, so no frame repaints it. */
  .edge i::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(100vw + 100vh);
    aspect-ratio: 1;
    background: conic-gradient(var(--light));
    transform: translate(-50%, -50%);
    will-change: transform;
    animation: spin 16s linear infinite paused;
  }
  .edge b:nth-child(1) i {
    padding: 1px;
  }
  .edge b:nth-child(2) {
    filter: blur(8px);
    opacity: 0.7;
  }
  .edge b:nth-child(2) i {
    padding: 5px;
  }
  .edge b:nth-child(3) {
    filter: blur(40px);
    opacity: 0.4;
  }
  .edge b:nth-child(3) i {
    padding: 22px;
  }
  .scanning .edge,
  .lit .edge {
    opacity: 1;
  }
  .scanning .edge i::before,
  .lit .edge i::before {
    animation-play-state: running;
  }
  @keyframes spin {
    to {
      transform: translate(-50%, -50%) rotate(1turn);
    }
  }

  /* ── The frame: corner marks close in on the page, like a lens finding focus; Oya's orb holds the fourth corner ── */
  .hud i {
    position: fixed;
    width: 34px;
    height: 34px;
    pointer-events: none;
    border: 0 solid #c9ffdccc;
    filter: drop-shadow(0 0 5px #39ed3599);
    opacity: 0;
    transform: translate(var(--hx), var(--hy)) scale(1.2);
    transition:
      opacity 1400ms var(--ease),
      transform 2000ms var(--ease);
  }
  .hud i:nth-child(1) {
    --hx: -14px;
    --hy: -14px;
    left: 16px;
    top: 16px;
    border-width: 1px 0 0 1px;
    border-top-left-radius: 10px;
  }
  .hud i:nth-child(2) {
    --hx: 14px;
    --hy: -14px;
    right: 16px;
    top: 16px;
    border-width: 1px 1px 0 0;
    border-top-right-radius: 10px;
  }
  .hud i:nth-child(3) {
    --hx: -14px;
    --hy: 14px;
    left: 16px;
    bottom: 16px;
    border-width: 0 0 1px 1px;
    border-bottom-left-radius: 10px;
  }
  .scanning .hud i,
  .lit .hud i {
    opacity: 1;
    transform: none;
  }

  /*
   * ── The scan plane: a sheet of light with a holographic lattice in its wake ──
   * The line sits at the bottom of its band. The band moves down the page while its
   * lattice moves up by exactly as much, so the dots hold still on the page and the band
   * only uncovers them. Both are transforms, so the compositor runs it without a repaint.
   */
  .beam {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    height: 22vh;
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-22vh);
    will-change: transform, opacity;
    mask: linear-gradient(180deg, transparent, #000 80%);
  }
  .beam::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 10%, #5ef3ff0d 50%, #39ed3524 88%, #a6ffc94d);
  }
  /* The line: a white hairline inside a wide, soft mint glow, brightest in the middle. */
  .beam::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #a6ffc9 12%, #ffffff 50%, #a6ffc9 88%, transparent);
    box-shadow:
      0 0 6px 1px #ffffffcc,
      0 0 22px 4px #39ed35a6,
      0 0 80px 16px #5ef3ff40;
  }
  .beam i {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 100vh;
    background: radial-gradient(circle, #c9ffdc66 0.7px, transparent 1.2px) 0 0 / 12px 12px;
    will-change: transform;
  }
  /*
   * While the agent reads, the plane sweeps down the page on a steady loop, fading in at
   * the top and out at the bottom. The reveal waits for a sweep to end (show-clock.ts),
   * so its pass is simply the next sweep and the beam never jumps back from halfway down.
   */
  .scanning .beam.loop,
  .scanning .beam.loop i {
    animation: sweep-loop var(--loop, 1800ms) var(--glide) infinite;
  }
  .scanning .beam.loop i {
    animation-name: hold;
  }
  @keyframes sweep-loop {
    from {
      opacity: 0;
      transform: translateY(-22vh);
    }
    18%,
    82% {
      opacity: 1;
    }
    to {
      opacity: 0;
      transform: translateY(78vh);
    }
  }
  /* The reveal's single pass runs at an even pace, so the line reaches each element when that element lights up. */
  .revealing .beam.pass,
  .revealing .beam.pass i {
    animation: sweep-pass var(--reveal, 2400ms) linear forwards;
  }
  .revealing .beam.pass i {
    animation-name: hold;
  }
  /* When the agent changes the page mid-show, everything the show drew lets go quickly: the pass dims, the outlines and the veil fade. */
  .passwrap {
    position: fixed;
    inset: 0;
    pointer-events: none;
    transition: opacity 400ms var(--ease);
  }
  .dismissing .passwrap {
    opacity: 0;
  }
  .dismissing .stage,
  .dismissing #veil {
    transition-duration: 450ms;
  }
  @keyframes sweep-pass {
    from {
      opacity: 0;
      transform: translateY(-22vh);
    }
    6%,
    90% {
      opacity: 1;
    }
    to {
      opacity: 0;
      transform: translateY(78vh);
    }
  }
  @keyframes hold {
    from {
      transform: translateY(22vh);
    }
    to {
      transform: translateY(-78vh);
    }
  }

  .stage {
    position: fixed;
    inset: 0;
    pointer-events: none;
    contain: strict;
    transition: opacity var(--fade, 1200ms) var(--ease);
  }
  .stage.leaving {
    opacity: 0;
  }
  /*
   * ── A found element: a rim of light around its window in the veil ──
   * Placed by transform, so following the page is a compositor move. Only opacity and
   * transform ever animate, and each is added only when the scan plane reaches it, so
   * the GPU takes on a few at a time rather than a hundred at once. The rim settles in
   * from just outside, a bloom of its colour breathes out once, and its number rises.
   */
  .box {
    position: absolute;
    left: 0;
    top: 0;
    box-sizing: border-box;
    /* Only the move glides, at the veil's pace: animating a size would lay the page out again on every frame. */
    transition:
      transform 320ms var(--ease),
      opacity 700ms var(--ease);
  }
  .box.gone {
    opacity: 0;
  }
  /* At the window's top or left edge its number tucks just inside the corner, where it can be seen. */
  .box.tucked b {
    top: 3px;
    left: 3px;
  }
  /* Its number would land on another's: the rim stays, the number does not. */
  .box.quiet b {
    display: none;
  }
  /* The rim: a one-pixel ring of light, white where the light strikes it and cyan where it leaves. */
  .box::before {
    content: '';
    position: absolute;
    inset: -3px;
    padding: 1px;
    border-radius: 8px;
    background: linear-gradient(135deg, #ffffff, var(--c) 30%, var(--c) 70%, var(--cyan));
    mask:
      linear-gradient(#000 0 0) content-box exclude,
      linear-gradient(#000 0 0);
    opacity: 1;
    transition:
      transform var(--fade, 1200ms) var(--ease),
      opacity var(--fade, 1200ms) var(--ease);
    animation: rim 1100ms var(--ease) backwards;
  }
  @keyframes rim {
    from {
      opacity: 0;
      transform: scale(var(--sx), var(--sy));
    }
    40% {
      opacity: 1;
    }
  }
  .stage.busy .box::before {
    opacity: 0.8;
  }
  /* On the way out the rims let go: they drift back outward as they fade. */
  .stage.leaving .box::before {
    opacity: 0;
    transform: scale(var(--sx), var(--sy));
  }
  /* The bloom: the element's colour glows out from the rim once, then lets the page be read. */
  .box::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 8px;
    box-shadow:
      0 0 16px 1px color-mix(in srgb, var(--c) 60%, transparent),
      inset 0 0 14px color-mix(in srgb, var(--c) 28%, transparent);
    /* Its resting glow is faint, so nothing keeps animating once it has settled. */
    opacity: 0.3;
    animation: bloom 2200ms var(--ease) 180ms backwards;
  }
  @keyframes bloom {
    from {
      opacity: 0;
    }
    22% {
      opacity: 1;
    }
  }
  /* Its number: a small glass chip in a monospace face, pinned outside the top-left corner. */
  .box b {
    position: absolute;
    z-index: 1;
    top: -10px;
    left: -10px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    box-sizing: border-box;
    border-radius: 4px;
    background: #070b09e6;
    box-shadow:
      inset 0 0 0 0.5px color-mix(in srgb, var(--c) 80%, transparent),
      0 0 10px color-mix(in srgb, var(--c) 40%, transparent),
      0 2px 6px #00000059;
    color: #e8fff0;
    font: 600 10px/16px var(--mono);
    font-variant-numeric: tabular-nums;
    text-align: center;
    letter-spacing: 0.03em;
    animation: tag 900ms var(--ease) 420ms backwards;
  }
  /* On a busy page the numbers show as each element lights up, then step back, leaving the rims. */
  .stage.busy .box b {
    opacity: 0;
    animation: flash-tag 3200ms var(--ease) 420ms backwards;
  }
  /* The number rises into place, rather than popping. */
  @keyframes tag {
    from {
      opacity: 0;
      transform: translateY(5px) scale(0.75);
    }
  }
  @keyframes flash-tag {
    from {
      opacity: 0;
      transform: translateY(5px) scale(0.75);
    }
    18%,
    80% {
      opacity: 1;
      transform: none;
    }
    to {
      opacity: 0;
      transform: scale(0.9);
    }
  }

  /*
   * ── The sparks: found elements send light curving into the orb ──
   * The spark moves across on an ease-in while its dot moves down on an ease-out, and
   * the two together bend its path into an arc.
   */
  .sparks {
    position: fixed;
    inset: 0;
    pointer-events: none;
    contain: strict;
  }
  .spark {
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(var(--fx), var(--fy));
    animation: spark-x var(--fly, 1600ms) cubic-bezier(0.55, 0, 0.9, 0.4) var(--d) both;
  }
  .spark i {
    position: absolute;
    left: -2.5px;
    top: -2.5px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow:
      0 0 5px 2px var(--c),
      0 0 16px 4px color-mix(in srgb, var(--c) 50%, transparent);
    animation: spark-y var(--fly, 1600ms) cubic-bezier(0.1, 0.6, 0.4, 1) var(--d) both;
  }
  @keyframes spark-x {
    to {
      transform: translate(calc(var(--fx) + var(--dx)), var(--fy));
    }
  }
  @keyframes spark-y {
    from {
      opacity: 0;
      transform: scale(0.4);
    }
    12% {
      opacity: 1;
      transform: scale(1.2);
    }
    88% {
      opacity: 1;
    }
    to {
      opacity: 0;
      transform: translateY(var(--dy)) scale(0.5);
    }
  }

  /*
   * ── The target: when Oya acts on an element, light reaches out from it and a ring locks on ──
   * Placed by transform like an outline; it plays once and is removed.
   */
  .targets {
    position: fixed;
    inset: 0;
    pointer-events: none;
    contain: strict;
  }
  .target {
    position: absolute;
    left: 0;
    top: 0;
  }
  /* Oya's reach is quick, and so is the ring: a click can take the page away a moment later. */
  .targets .spark {
    --fly: 260ms;
  }
  .target::before {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 10px;
    border: 1.5px solid var(--c);
    box-shadow:
      0 0 18px 2px color-mix(in srgb, var(--c) 55%, transparent),
      inset 0 0 14px color-mix(in srgb, var(--c) 30%, transparent);
    opacity: 0;
    animation: target 1200ms var(--ease) var(--lag, 160ms) backwards;
  }
  @keyframes target {
    from {
      opacity: 0;
      transform: scale(var(--sx), var(--sy));
    }
    25%,
    65% {
      opacity: 1;
      transform: none;
    }
    to {
      opacity: 0;
      transform: none;
    }
  }

  /* ── The companion: Oya's core, a living light held in glass, and what it says beside it ── */
  /* Far enough from the window's edges that its glow, orbit and pulses fade out before they reach them, rather than being cut off. */
  .companion {
    position: fixed;
    right: 30px;
    bottom: 30px;
    display: flex;
    align-items: center;
    gap: 14px;
    pointer-events: none;
  }

  /* The caption: what Oya is doing, in words big enough to catch from the corner of an eye. */
  .caption {
    position: relative;
    max-width: min(440px, 62vw);
    padding: 9px 18px 11px 16px;
    border-radius: 16px;
    background: linear-gradient(180deg, #131715f7, #090c0afc);
    backdrop-filter: blur(24px) saturate(1.6);
    box-shadow:
      inset 0 1px 0 #ffffff1f,
      0 8px 24px #00000066,
      0 2px 6px #00000040,
      0 0 18px #39ed3524;
    opacity: 0;
    filter: blur(8px);
    transform: translateX(14px) scale(0.96);
    transform-origin: right center;
    transition:
      opacity 600ms var(--ease),
      filter 600ms var(--ease),
      transform 900ms var(--ease);
  }
  /* Its edge light: a hairline, faint where it starts and mint where it meets the orb. */
  .caption::before {
    content: '';
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: inherit;
    background: linear-gradient(90deg, #ffffff14, #a6ffc94d 65%, #39ed35bf);
    mask:
      linear-gradient(#000 0 0) content-box exclude,
      linear-gradient(#000 0 0);
  }
  .companion.talking .caption {
    opacity: 1;
    filter: none;
    transform: none;
  }
  /* Who is speaking, as subtitles say it: Oya's name in small capitals, with a voice line that moves while it talks. */
  .speaker {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 3px;
    color: #a6ffc9;
    font: 600 9.5px/12px var(--mono);
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .wave {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 10px;
  }
  .wave i {
    width: 2px;
    height: 10px;
    border-radius: 1px;
    background: currentColor;
    transform: scaleY(0.3);
  }
  .talking .wave i {
    animation: voice 1.2s var(--glide) infinite;
  }
  .busy .wave i {
    animation-duration: 0.7s;
  }
  .wave i:nth-child(2) {
    animation-delay: -0.4s;
  }
  .wave i:nth-child(3) {
    animation-delay: -0.8s;
  }
  .wave i:nth-child(4) {
    animation-delay: -0.2s;
  }
  @keyframes voice {
    50% {
      transform: scaleY(1);
    }
  }
  /* The words: large and bright, two lines at most, each word rising into place in turn. */
  .words {
    display: -webkit-box;
    overflow: hidden;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    color: #f7f7f2;
    font-size: 15.5px;
    font-weight: 500;
    line-height: 21px;
    letter-spacing: -0.01em;
    text-shadow: 0 1px 2px #00000066;
  }
  .words .w {
    display: inline-block;
    white-space: pre-wrap;
    animation: word 700ms var(--ease) calc(var(--i, 0) * 55ms) backwards;
  }
  @keyframes word {
    from {
      opacity: 0;
      filter: blur(4px);
      transform: translateY(5px);
    }
  }

  /* The orb: a dark glass lens on a rim of light, with Oya's mark floating over a slowly turning core. */
  .orb {
    position: relative;
    width: 60px;
    height: 60px;
    flex: none;
    transform-origin: bottom right;
    transition:
      transform 900ms var(--ease),
      opacity 500ms var(--ease);
  }
  /* Resting, it sits small and still, and covers as little of the page as it can. */
  .companion:not(.talking) .orb {
    transform: scale(0.74);
    opacity: 0.92;
  }
  /*
   * The light turns by rotating its elements, on the compositor; a turning gradient would
   * repaint every frame. The rim always turns slowly while Oya talks, and the wrapper adds
   * a second turn while it reads; pausing rather than changing a speed means no jump.
   */
  .orb .spin {
    position: absolute;
    inset: 0;
    animation: turn 5s linear infinite paused;
  }
  .scanning .orb .spin {
    animation-play-state: running;
  }
  .orb .halo,
  .orb .ring {
    position: absolute;
    border-radius: 50%;
    background: conic-gradient(var(--light));
  }
  @keyframes turn {
    to {
      transform: rotate(1turn);
    }
  }
  .orb .halo {
    inset: -4px;
    filter: blur(12px);
    opacity: 0;
    transition: opacity 800ms var(--ease);
  }
  .talking .orb .halo {
    opacity: 0.45;
  }
  .scanning .orb .halo,
  .acting .orb .halo {
    opacity: 0.8;
  }
  .found .orb .halo {
    animation: charge 4s var(--ease);
  }
  @keyframes charge {
    20% {
      opacity: 0.55;
    }
    70% {
      opacity: 1;
      transform: scale(1.15);
    }
  }
  .orb .ring {
    inset: 0;
    opacity: 0.55;
    animation: turn 14s linear infinite paused;
    transition: opacity 600ms var(--ease);
  }
  .talking .orb .ring {
    opacity: 1;
    animation-play-state: running;
  }
  .orb .lens {
    position: absolute;
    inset: 2px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #262b28, #0f1211 55%, #070908);
    box-shadow:
      inset 0 1px 0 #ffffff2e,
      inset 0 -8px 14px #000000a6;
    overflow: hidden;
  }
  /* The glass's highlight, over everything inside it. */
  .orb .lens::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(ellipse 70% 42% at 50% 6%, #ffffff40, transparent 70%),
      radial-gradient(ellipse 60% 30% at 50% 100%, #39ed3526, transparent 70%);
  }
  /* The core: two soft lights, green and cyan, circling behind the mark like something alive in the glass. */
  .orb .core {
    position: absolute;
    inset: 0;
    animation: turn 9s linear infinite paused;
  }
  .talking .orb .core {
    animation-play-state: running;
  }
  .orb .core i {
    position: absolute;
    width: 56%;
    height: 56%;
    border-radius: 50%;
    filter: blur(10px);
    mix-blend-mode: screen;
    opacity: 0.3;
    transition: opacity 800ms var(--ease);
  }
  .orb .core i:nth-child(1) {
    left: 2%;
    top: 4%;
    background: #39ed35;
  }
  .orb .core i:nth-child(2) {
    right: 2%;
    bottom: 4%;
    background: #5ef3ff;
  }
  .talking .orb .core i {
    opacity: 0.5;
  }
  /* The orbit: a tilted ring with one bright point travelling it, behind the orb while Oya talks, so the point passes behind the glass. */
  .orb .orbit {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid #a6ffc970;
    opacity: 0;
    transform: rotateX(74deg);
