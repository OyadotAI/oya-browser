# Authenticate only protected Windows signing jobs after validating their approved identity configuration.
name: Windows managed signing
description: Validate managed-signing inputs and authenticate Azure CLI through GitHub OIDC
runs:
  using: composite
  steps:
    - name: Validate Windows signing configuration
      shell: pwsh
      run: node "$env:GITHUB_WORKSPACE/browser/build/windows-signing.cjs"
    - name: Authenticate signing identity
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        audience: api://AzureADTokenExchange
        allow-no-subscriptions: true
