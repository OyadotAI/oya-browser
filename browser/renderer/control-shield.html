<!doctype html>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
<style>
  /* Oya's own tokens (ui/src/app/globals.css), and one light the whole show is lit by. */
  :root {
    --oya: #39ed35;
    --paper: #f4f3ef;
    --ink: #0c0c0a;
    --light: #39ed35, #9dffa0, #f4f3ef, #1fd6a0, #6cb4ff, #39ed35;
    /* A soft spring, sampled: it settles without a bounce you can see. */
    --spring: linear(
      0,
      0.009,
      0.035 2.1%,
      0.141 4.4%,
      0.723 12.9%,
      0.938 16.7%,
      1.017 20.4%,
      1.043 24.5%,
      1.035 29.4%,
      1.007 38.6%,
      0.997 48.3%,
      1
    );
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  @property --angle {
    syntax: '<angle>';
    inherits: true;
    initial-value: 0deg;
  }
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    cursor: default;
    user-select: none;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Watch-only, said quietly: a hairline, nothing more. */
  body {
    box-shadow: inset 0 0 0 1px #39ed3526;
    box-sizing: border-box;
  }

  /* ── The edge light: while the agent reads, light flows around the page ── */
  .edge {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 700ms var(--ease);
  }
  /* Each layer masks its light to a frame, and its wrapper blurs it: a filter runs before a mask, so the blur must sit outside. */
  .edge b {
    position: absolute;
    inset: 0;
  }
  .edge i {
    position: absolute;
    inset: 0;
    overflow: hidden;
    mask:
      linear-gradient(#000 0 0) content-box exclude,
      linear-gradient(#000 0 0);
  }
  /* The light itself: a square of colour wide enough to cover the page at any angle, turned on the compositor, so no frame repaints it. */
  .edge i::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(100vw + 100vh);
    aspect-ratio: 1;
    background: conic-gradient(var(--light));
    transform: translate(-50%, -50%);
    will-change: transform;
    animation: spin 5s linear infinite paused;
  }
  .edge b:nth-child(1) i {
    padding: 1.5px;
  }
  .edge b:nth-child(2) {
    filter: blur(10px);
    opacity: 0.85;
  }
  .edge b:nth-child(2) i {
    padding: 6px;
  }
  .edge b:nth-child(3) {
    filter: blur(34px);
    opacity: 0.6;
  }
  .edge b:nth-child(3) i {
    padding: 18px;
  }
  .scanning .edge,
  .revealing .edge {
    opacity: 1;
  }
  .scanning .edge i::before,
  .revealing .edge i::before {
    animation-play-state: running;
  }
  @keyframes spin {
    to {
      transform: translate(-50%, -50%) rotate(1turn);
    }
  }
  @keyframes flow {
    to {
      --angle: 1turn;
    }
  }
  .tint {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    box-shadow: inset 0 0 140px #39ed351f;
    transition: opacity 900ms var(--ease);
  }
  .scanning .tint {
    opacity: 1;
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe {
    50% {
      opacity: 0.55;
    }
  }

  /*
   * ── The beam: a laser line with a holographic dot grid in its wake ──
   * The line sits at the bottom of its band. The band moves down the page while its grid
   * moves up by exactly as much, so the dots hold still on the page and the band only
   * uncovers them. Both are transforms, so the compositor runs it without a repaint.
   */
  .beam {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    height: 34vh;
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-34vh);
    will-change: transform, opacity;
    mask: linear-gradient(180deg, transparent, #000 85%);
    transition: opacity 500ms var(--ease);
  }
  .beam::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 20%, #39ed350f 70%, #39ed3526);
  }
  /* The line: a bright core in a green glow. */
  .beam::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #9dffa0 18%, #ffffff 50%, #9dffa0 82%, transparent);
    box-shadow:
      0 0 12px 2px #39ed3599,
      0 0 42px 8px #39ed3540;
  }
  .beam i {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 100vh;
    background: radial-gradient(circle, #39ed3573 0.9px, transparent 1.4px) 0 0 / 14px 14px;
    will-change: transform;
  }
  .scanning .beam.loop {
    opacity: 1;
  }
  .beam.loop,
  .beam.loop i {
    animation: 1.9s cubic-bezier(0.45, 0, 0.55, 1) infinite paused;
  }
  .beam.loop {
    animation-name: sweep;
  }
  .beam.loop i {
    animation-name: hold;
  }
  .scanning .beam.loop,
  .scanning .beam.loop i {
    animation-play-state: running;
  }
  /* The reveal's single pass runs at an even pace, so the line reaches each element when that element lights up. */
  .revealing .beam.pass {
    opacity: 1;
  }
  .revealing .beam.pass,
  .revealing .beam.pass i {
    animation: sweep var(--reveal, 1100ms) linear forwards;
  }
  .revealing .beam.pass i {
    animation-name: hold;
  }
  @keyframes sweep {
    from {
      transform: translateY(-34vh);
    }
    to {
      transform: translateY(66vh);
    }
  }
  @keyframes hold {
    from {
      transform: translateY(34vh);
    }
    to {
      transform: translateY(-66vh);
    }
  }

  .stage {
    position: fixed;
    inset: 0;
    pointer-events: none;
    contain: strict;
    transition: opacity var(--fade, 600ms) var(--ease);
  }
  .stage.leaving {
    opacity: 0;
  }
  /*
   * An outline sits exactly on its element: placed by transform, so following the page
   * is a compositor move, and it never ends up past the element's edges. Only opacity and
   * transform ever animate, and each outline is added only when the beam reaches it, so
   * the GPU takes on a few at a time rather than a hundred at once.
   * When the beam reaches it: brackets lock on from just outside, a shine crosses it,
   * the hairline settles and its number pops up.
   */
  .box {
    --lock: cubic-bezier(0.16, 1, 0.3, 1);
    --k: min(11px, 34%);
    /* A frame masked to its four corners: the brackets, and their colour-split ghosts. */
    --corners:
      linear-gradient(#000 0 0) left top / var(--k) var(--k) no-repeat,
      linear-gradient(#000 0 0) right top / var(--k) var(--k) no-repeat,
      linear-gradient(#000 0 0) left bottom / var(--k) var(--k) no-repeat,
      linear-gradient(#000 0 0) right bottom / var(--k) var(--k) no-repeat;
    position: absolute;
    left: 0;
    top: 0;
    box-sizing: border-box;
    transition:
      transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
      width 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
      height 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
      opacity 280ms var(--ease);
  }
  .box.gone {
    opacity: 0;
  }
  /* Its number would land on another's: the outline stays, the number does not. */
  .box.quiet b {
    display: none;
  }

  /* The hairline and a glassy tint, inside the element's edge. */
  .box::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 6px;
    background: linear-gradient(
      135deg,
      color-mix(in srgb, var(--c) 12%, transparent),
      color-mix(in srgb, var(--c) 4%, transparent)
    );
    box-shadow:
      inset 0 0 0 1px color-mix(in srgb, var(--c) 60%, transparent),
      inset 0 1px 0 #ffffff26;
    /* Its resting look is dim, so nothing keeps animating once it has settled: the lock plays bright, then ends. */
    opacity: 0.4;
    animation: show 2000ms var(--ease) 160ms backwards;
  }
  /* The brackets: a 2px frame masked to its four corners, arriving from --sx/--sy (8px out) and locking on. */
  .box::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 2px solid var(--c);
    border-radius: 6px;
    mask: var(--corners);
    transition:
      transform var(--fade, 600ms) var(--ease),
      opacity var(--fade, 600ms) var(--ease);
    animation: lock 620ms var(--lock) backwards;
  }
  @keyframes lock {
    from {
      opacity: 0;
      transform: scale(var(--sx), var(--sy));
    }
    35% {
      opacity: 1;
    }
  }
  /* On the way out the brackets let go: they drift back outward as they fade. */
  .stage.leaving .box::after {
    opacity: 0;
    transform: scale(var(--sx), var(--sy));
  }
  /* The colour split: a cyan and a magenta copy of the brackets, off to either side, converging into the real ones. */
  .box s::before,
  .box s::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 2px solid #00e5ff;
    border-radius: 6px;
    mask: var(--corners);
    opacity: 0;
    animation: split 560ms var(--lock) backwards;
  }
  .box s::before {
    --gx: -5px;
  }
  .box s::after {
    --gx: 5px;
    border-color: #ff3dcf;
  }
  @keyframes split {
    from {
      opacity: 0;
      transform: translateX(var(--gx)) scale(var(--sx), var(--sy));
    }
    1% {
      opacity: 0.9;
    }
  }
  /* The ripple: a ring of light that leaves the element as the brackets lock. */
  .box u {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    box-shadow:
      0 0 0 1px color-mix(in srgb, var(--c) 75%, transparent),
      0 0 14px color-mix(in srgb, var(--c) 45%, transparent);
    opacity: 0;
    animation: ripple 760ms cubic-bezier(0.2, 0.7, 0.2, 1) 200ms;
  }
  @keyframes ripple {
    12% {
      opacity: 0.9;
    }
    to {
      opacity: 0;
      transform: scale(var(--rx), var(--ry));
    }
  }
  /* Lights up as the brackets lock, holds, then dims to rest, so the page stays readable under a hundred of them. */
  @keyframes show {
    from {
      opacity: 0;
    }
    12%,
    55% {
      opacity: 1;
    }
  }
  /* The shine: a band of light crossing the element once, clipped to it. */
  .box i {
    position: absolute;
    inset: 0;
    border-radius: 6px;
    overflow: hidden;
  }
  .box i::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 60%;
    background: linear-gradient(100deg, transparent, color-mix(in srgb, var(--c) 30%, #ffffff66), transparent);
    opacity: 0;
    transform: translateX(-110%) skewX(-18deg);
    animation: shine 800ms cubic-bezier(0.4, 0, 0.2, 1) 60ms;
  }
  @keyframes shine {
    15%,
    70% {
      opacity: 1;
    }
    to {
      opacity: 0;
      transform: translateX(260%) skewX(-18deg);
    }
  }
  /* Its number, pinned to the top-left corner. */
  .box b {
    position: absolute;
    z-index: 1;
    top: -7px;
    left: -7px;
    min-width: 16px;
    height: 16px;
    padding: 0 5px;
    box-sizing: border-box;
    border-radius: 8px;
    background: #0c0c0ae6;
    box-shadow:
      0 0 0 1px color-mix(in srgb, var(--c) 70%, transparent),
      0 0 10px color-mix(in srgb, var(--c) 45%, transparent),
      0 2px 6px #0000004d;
    color: var(--paper);
    font-size: 9.5px;
    font-weight: 600;
    line-height: 16px;
    font-variant-numeric: tabular-nums;
    text-align: center;
    letter-spacing: 0.02em;
    animation: tag 520ms var(--spring) 220ms backwards;
  }
  /* On a busy page the numbers show as each outline locks on, then step back, leaving the brackets. */
  .stage.busy .box b {
    opacity: 0;
    animation: flash-tag 2000ms var(--ease) 220ms backwards;
  }
  @keyframes flash-tag {
    from {
      opacity: 0;
      transform: scale(0.4);
    }
    18%,
    80% {
      opacity: 1;
      transform: none;
    }
    to {
      opacity: 0;
      transform: scale(0.8);
    }
  }
  @keyframes tag {
    from {
      opacity: 0;
      transform: scale(0.4);
    }
  }

  /*
   * ── The sparks: found elements send light curving into the orb ──
   * The spark moves across on an ease-in while its dot moves down on an ease-out, and
   * the two together bend its path into an arc.
   */
  .sparks {
    position: fixed;
    inset: 0;
    pointer-events: none;
    contain: strict;
  }
  .spark {
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(var(--fx), var(--fy));
    animation: spark-x var(--fly, 900ms) cubic-bezier(0.55, 0, 0.9, 0.4) var(--d) both;
  }
  .spark i {
    position: absolute;
    left: -3px;
    top: -3px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow:
      0 0 6px 2px var(--c),
      0 0 18px 4px color-mix(in srgb, var(--c) 55%, transparent);
    animation: spark-y var(--fly, 900ms) cubic-bezier(0.1, 0.6, 0.4, 1) var(--d) both;
  }
  @keyframes spark-x {
    to {
      transform: translate(calc(var(--fx) + var(--dx)), var(--fy));
    }
  }
  @keyframes spark-y {
    from {
      opacity: 0;
      transform: scale(0.4);
    }
    12% {
      opacity: 1;
      transform: scale(1.3);
    }
    88% {
      opacity: 1;
    }
    to {
      opacity: 0;
      transform: translateY(var(--dy)) scale(0.5);
    }
  }

  /* ── The companion: the Oya mark on a glass lens, ringed by living light ── */
  .companion {
    position: fixed;
    right: 20px;
    bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: none;
  }
  .bubble {
    height: 34px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-radius: 17px;
    background: #141411e0;
    backdrop-filter: blur(30px) saturate(1.8);
    border: 0.5px solid #ffffff2e;
    color: var(--paper);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.005em;
    white-space: nowrap;
    box-shadow:
      inset 0 0.5px 0 #ffffff26,
      0 8px 28px #0000004d,
      0 1px 3px #00000033;
    opacity: 0;
    filter: blur(8px);
    transform: translateX(12px) scale(0.94);
    transform-origin: right center;
    transition:
      opacity 400ms var(--ease),
      filter 400ms var(--ease),
      transform 800ms var(--spring);
  }
  .companion.talking .bubble {
    opacity: 1;
    filter: none;
    transform: none;
  }
  .words.enter {
    animation: arrive 520ms var(--ease);
  }
  @keyframes arrive {
    from {
      opacity: 0;
      filter: blur(5px);
      transform: translateY(3px);
    }
  }
  /* Light passing through the words while the agent reads. */
  .words.shimmer {
    color: transparent;
    background: linear-gradient(90deg, #f4f3efb3 0%, #f4f3efb3 38%, #ffffff 50%, #f4f3efb3 62%, #f4f3efb3 100%) 0 0 /
      250% 100%;
    background-clip: text;
    animation:
      arrive 520ms var(--ease),
      shimmer 1.8s linear infinite;
  }
  @keyframes shimmer {
    from {
      background-position: 100% 0;
    }
    to {
      background-position: -150% 0;
    }
  }

  .orb {
    position: relative;
    width: 52px;
    height: 52px;
    transform-origin: bottom right;
    animation: flow 9s linear infinite paused;
    transition:
      transform 900ms var(--spring),
      opacity 500ms var(--ease);
  }
  /* Resting, it sits small and still, and covers as little of the page as it can. */
  .companion:not(.talking) .orb {
    transform: scale(0.78);
    opacity: 0.9;
  }
  .talking .orb {
    animation-play-state: running;
  }
  .scanning .orb {
    animation-duration: 2.4s;
  }
  .orb .halo,
  .orb .ring {
    position: absolute;
    border-radius: 50%;
    background: conic-gradient(from var(--angle), var(--light));
  }
  .orb .halo {
    inset: -6px;
    filter: blur(14px);
    opacity: 0;
    transition: opacity 600ms var(--ease);
  }
  .scanning .orb .halo {
    opacity: 0.75;
  }
  .found .orb .halo {
    animation: charge 2.6s var(--ease);
  }
  @keyframes charge {
    20% {
      opacity: 0.55;
    }
    70% {
      opacity: 1;
      transform: scale(1.3);
    }
  }
  .orb .ring {
    inset: 0;
    opacity: 0.55;
    transition: opacity 600ms var(--ease);
  }
  .talking .orb .ring {
    opacity: 1;
  }
  .orb .lens {
    position: absolute;
    inset: 2.5px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #2b2b26, #121210 55%, #0a0a08);
    box-shadow:
      inset 0 1px 0 #ffffff2e,
      inset 0 -6px 12px #00000080;
    overflow: hidden;
  }
  .orb .lens::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(ellipse 70% 45% at 50% 8%, #ffffff33, transparent 70%);
  }
  .found .orb {
    animation-name: flow, pop;
    animation-duration: 9s, 700ms;
    animation-timing-function: linear, var(--spring);
    animation-iteration-count: infinite, 1;
    animation-delay: 0s, 1.5s;
  }
  @keyframes pop {
    35% {
      transform: scale(1.08);
    }
  }
  .mark {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .mark .back {
    transform-origin: 47px 47px;
    transition: transform 900ms var(--spring);
  }
  .scanning .mark .back {
    animation: orbit 2.4s var(--ease) infinite;
  }
  @keyframes orbit {
    to {
      transform: rotate(1turn);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
    }
  }
</style>
<body aria-label="Page is watch-only. Use Take control in the browser toolbar to interact.">
  <div class="tint"></div>
  <div class="edge">
    <b><i></i></b><b><i></i></b><b><i></i></b>
  </div>
  <div class="beam loop"><i></i></div>
  <div class="beam pass"><i></i></div>
  <div id="stage" class="stage"></div>
  <div id="sparks" class="sparks"></div>
  <div id="companion" class="companion" aria-hidden="true">
    <div class="bubble"><span id="bubble-text" class="words"></span></div>
    <div class="orb">
      <div class="halo"></div>
      <div class="ring"></div>
      <div class="lens">
        <!-- The Oya mark: the green ring behind, offset, and the white ring in front. -->
        <svg class="mark" viewBox="0 0 100 100">
          <g class="back">
            <circle cx="53" cy="53" r="19" fill="none" stroke="#39ed35" stroke-width="9.5" />
          </g>
          <circle cx="47" cy="47" r="19" fill="none" stroke="#f4f3ef" stroke-width="9.5" />
        </svg>
      </div>
    </div>
  </div>
  <script src="core/constants.js"></script>
  <script src="control-shield.js"></script>
</body>
