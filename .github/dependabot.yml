# Weekly dependency updates, one grouped pull request per folder, so a week's
# bumps land together and CI judges them together. Security fixes come as they
# are published, outside the weekly batch.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; lift when it supports 7.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Node's types follow the Node version the part runs on, not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      root:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; lift when it supports 7.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Node's types follow the Node version the part runs on, not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      server:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; lift when it supports 7.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Node's types follow the Node version the part runs on, not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # eslint-config-next's react, import and jsx-a11y plugins stop at ESLint 9.
      - dependency-name: eslint
        versions: ['>=10.0.0']
    groups:
      ui:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /browser
    schedule:
      interval: weekly
    groups:
      browser:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
