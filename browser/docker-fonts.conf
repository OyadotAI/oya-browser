<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The container's fonts, under the names a Mac has.

  A persona that says Mac is checked by which fonts a page can find: a "Mac" with
  Liberation Sans and no Helvetica or Menlo is a Linux box, and DataDome and Akamai
  both enumerate fonts. Apple's fonts cannot ship here, so open fonts drawn to the
  same metrics are registered under the Mac family names at scan time (the files are
  not modified), and lose their own names, so a page finds only a Mac's set.

  Metric-compatible: Nimbus Sans = Helvetica, Liberation = Arial / Times / Courier,
  DejaVu Sans Mono = Menlo (Menlo is derived from it), P052 = Palatino. The rest
  (Lucida Grande, Geneva, Verdana, Georgia, Apple Color Emoji) are present by name
  but measure differently. SF Pro is left out: macOS does not expose it by name either.
-->
<fontconfig>
  <!-- family name the file carries, then the Mac names it answers to instead -->
  <match target="scan"><test name="family"><string>Liberation Sans</string></test>
    <edit name="family" mode="assign_replace"><string>Arial</string></edit></match>
  <match target="scan"><test name="family"><string>Liberation Sans Narrow</string></test>
    <edit name="family" mode="assign_replace"><string>Arial Narrow</string></edit></match>
  <match target="scan"><test name="family"><string>Liberation Serif</string></test>
    <edit name="family" mode="assign_replace"><string>Times New Roman</string><string>Times</string></edit></match>
  <match target="scan"><test name="family"><string>Liberation Mono</string></test>
    <edit name="family" mode="assign_replace"><string>Courier New</string><string>Courier</string></edit></match>
  <match target="scan"><test name="family"><string>Nimbus Sans</string></test>
    <edit name="family" mode="assign_replace"><string>Helvetica</string><string>Helvetica Neue</string></edit></match>
  <match target="scan"><test name="family"><string>P052</string></test>
    <edit name="family" mode="assign_replace"><string>Palatino</string></edit></match>
  <match target="scan"><test name="family"><string>DejaVu Sans Mono</string></test>
    <edit name="family" mode="assign_replace"><string>Menlo</string><string>Monaco</string></edit></match>
  <match target="scan"><test name="family"><string>DejaVu Sans</string></test>
    <edit name="family" mode="assign_replace"><string>Lucida Grande</string><string>Geneva</string><string>Verdana</string></edit></match>
  <match target="scan"><test name="family"><string>DejaVu Serif</string></test>
    <edit name="family" mode="assign_replace"><string>Georgia</string></edit></match>
  <match target="scan"><test name="family"><string>Noto Color Emoji</string></test>
    <edit name="family" mode="assign_replace"><string>Apple Color Emoji</string></edit></match>

  <!-- Chrome on a Mac: Times for serif, Helvetica for sans-serif, Courier for monospace -->
  <alias binding="strong"><family>serif</family><prefer><family>Times</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Helvetica</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Courier</family></prefer></alias>
  <alias binding="strong"><family>emoji</family><prefer><family>Apple Color Emoji</family></prefer></alias>
</fontconfig>
