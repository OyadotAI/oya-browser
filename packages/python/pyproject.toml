# The Python SDK for Oya Browser: the TypeScript SDK's core (@oya-ai/browser) for Python agent stacks.
[project]
name = "oya-browser"
version = "0.2.0"
description = "Real browsers for AI agents: start one on Oya Cloud or any provider, drive it, save a task as a playbook and replay it with no model. Plugs into browser-use over CDP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Oya", email = "sales@getoya.ai" }]
keywords = ["browser", "ai-agents", "browser-automation", "playwright", "cdp", "browser-use", "hipaa", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
browser-use = ["browser-use>=1.0; python_version >= '3.11'"]

[project.urls]
Homepage = "https://oyabrowser.com"
Documentation = "https://oyabrowser.com/docs/sdk"
Repository = "https://github.com/OyadotAI/oya-browser"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "PLR2004"]
# Docstrings say what a thing is or does ("Closes the pool"), as the TypeScript doc comments do.
ignore = ["D203", "D213", "D105", "D107", "D401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004"]

[tool.mypy]
strict = true
packages = ["oya_browser"]
mypy_path = "src"

# browser-use is an optional extra, imported only by for_browser_use().
[[tool.mypy.overrides]]
module = ["browser_use", "browser_use.*"]
ignore_missing_imports = true
