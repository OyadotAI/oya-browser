apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oya-browser-dev

resources:
- ../../base
- ingress.yaml
- cert.yaml

images:
- name: ghcr.io/oyadotai/oya-browser-server
  newTag: dev
- name: ghcr.io/oyadotai/oya-browser
  newTag: dev

labels:
  - pairs:
      app.kubernetes.io/version: dev
    includeSelectors: false

# Cloud sandboxes connect back from outside the cluster.
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: server
    spec:
      template:
        spec:
          containers:
          - name: server
            env:
            - name: OYA_PUBLIC_WS_URL
              value: wss://dev-browser.getoya.ai/ws
