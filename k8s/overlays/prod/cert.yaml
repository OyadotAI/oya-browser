apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oya-browser-cert
  namespace: oya-browser
spec:
  secretName: oya-browser-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - browser.getoya.ai
  # Legacy host, still served (redirects to the canonical domain)
  - browser.oya.ai
