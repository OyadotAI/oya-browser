apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app: server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-oyadotai
      containers:
      - name: server
        image: ghcr.io/oyadotai/oya-browser-server:latest
        imagePullPolicy: Always
        # Not runAsNonRoot: the server image installs as root and a managed
        # Docker fleet needs socket access, so flipping the uid here would break
        # existing deployments on upgrade. Dropping the capability set is the
        # part that costs nothing and removes NET_RAW, SETUID and DAC_OVERRIDE.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 3100
        envFrom:
        - secretRef:
            name: app-secrets
        env:
        - name: PORT
          value: "3100"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3100
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3100
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: server
  labels:
    app: server
spec:
  # Sticky sessions — browser WebSocket must stay on the same pod (connection registry is in-memory)
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - port: 3100
    targetPort: 3100
    protocol: TCP
  selector:
    app: server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: server-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: server
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
