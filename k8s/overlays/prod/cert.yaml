apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: oya-browser-cert
  namespace: oya-browser
spec:
  secretName: oya-browser-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - oyabrowser.com
  # Legacy hosts, still served (redirect to the canonical domain)
  - www.oyabrowser.com
  - browser.getoya.ai
  - browser.oya.ai
