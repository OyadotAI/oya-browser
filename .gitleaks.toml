# Secret scan settings for CI (ci.yaml "Secret scan"). The default rules apply;
# these paths hold only fake fixtures, example placeholders and public test keys.
[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures and examples carry fake keys by design."
paths = [
  '''(^|/)tests?/''',
  '''^server/test-[^/]+\.js$''',
  '''^examples/\.env\.example$''',
  '''^extension/content/agent\.js$''',
  '''^mars/crates/link/data/generate\.mjs$''',
]

[[allowlists]]
description = "TLS key-share group names in the Mars fingerprint notes read as a generic API key."
regexes = ['''X25519MLKEM768''']

[[allowlists]]
description = "The IndexNow key is public by design: the site serves it at /<key>.txt so engines can verify ownership (scripts/indexnow.mjs)."
regexes = ['''6133278fca7b72df2ea13fab91b68091''']
