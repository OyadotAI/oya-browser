# V9 owns bounded JavaScript execution independently of the Mars application.
[package]
name = "mars-v9"
version = "0.1.0"
edition = "2024"
publish = false
description = "V9: Mars's bounded, Rust-owned JavaScript runtime"

[dependencies]
mars-core = { path = "../core" }
# Namespace-aware XML well-formedness for XML and XHTML frame documents; no dependencies.
mars-xml = { path = "../xml" }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
ryu-js = "=1.0.3"
# Already in the workspace through the app; WHATWG URL parsing for location, URL and fetch.
url = "=2.5.8"
# Already in the workspace through url; UTS #46 for the URL host parser.
idna = "=1.1.0"
# Already in the workspace through idna; scalar Unicode normalization for String.normalize.
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
# Already in the workspace through idna; exact Unicode property data for regular expressions.
icu_properties = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
# Already in the workspace through rustls; the OS CSPRNG behind crypto.randomUUID.
ring = "=0.17.14"

[features]
# Upstream test hosts only: supplies inert fixture sources without filesystem authority.
# The browser service never enables the d8 compatibility host.
conformance = []
# Measurement builds only: exposes `measure::load_page_scaled`, which multiplies V9's heap bounds
# so the check example can report what real scripts would need. The service never enables it.
measure = []

[[example]]
name = "js"
required-features = ["measure"]

[[example]]
name = "page"
required-features = ["measure"]

[[example]]
name = "replay"
required-features = ["measure"]
