# The Oya control plane: N replicas behind one Service. Browsers are pods it
# starts in this namespace and that connect back to the Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oya-control-plane
  labels: { app: oya-control-plane }
spec:
  replicas: 2
  selector:
    matchLabels: { app: oya-control-plane }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: oya-control-plane }
    spec:
      serviceAccountName: oya-control-plane
      # Replicas in different zones (and nodes), so one failure never takes all.
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: oya-control-plane } } }
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: oya-control-plane } } }
      terminationGracePeriodSeconds: 60
      containers:
        - name: control-plane
          image: oya-control-plane
          ports: [{ name: http, containerPort: 3100 }]
          # Later sources win: optional settings first, so what the deployment
          # sets (config, then secrets) always overrides them.
          envFrom:
            - secretRef: { name: oya-settings, optional: true }
            - configMapRef: { name: oya-config }
            - secretRef: { name: oya-secrets }
          env:
            # Each replica announces its own address, for routing between replicas.
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            # The first start applies the database schema before it listens.
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: oya-control-plane
  labels: { app: oya-control-plane }
spec:
  selector: { app: oya-control-plane }
  ports: [{ name: http, port: 3100, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oya-control-plane
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: oya-control-plane }
